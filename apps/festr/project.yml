name: Festr
options:
  bundleIdPrefix: com.calumwebb
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: X9E4HG27NK
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
targets:
  Festr:
    type: application
    platform: iOS
    sources:
      - path: Festr
    dependencies:
      - target: FestrWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calumwebb.festr
        PRODUCT_NAME: Festr
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Festr/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Festr
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: '1'
        # Admin deployment, e.g. https://festr-admin.vercel.app. Empty uses the bundled feed only.
        FEED_BASE_URL: ''
  FestrWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FestrWidgets
      - path: Festr/Core
      - path: Festr/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calumwebb.festr.widgets
        PRODUCT_NAME: FestrWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FestrWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Festr
        INFOPLIST_KEY_NSHumanReadableCopyright: ''
        TARGETED_DEVICE_FAMILY: '1'
        SKIP_INSTALL: YES
  FestrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FestrUITests]
    dependencies:
      - target: Festr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.calumwebb.festr.uitests
        TARGETED_DEVICE_FAMILY: '1'
schemes:
  Festr:
    build:
      targets:
        Festr: all
        FestrUITests: [test]
    test:
      targets: [FestrUITests]
    archive:
      config: Release
