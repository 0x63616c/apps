name: Screenshots

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Ensure an iOS 26 simulator runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q '^iOS 26'; then
            xcodebuild -downloadPlatform iOS
          fi
      - name: Capture iPhone 17 Pro Max screens (light and dark)
        run: scripts/capture-screenshots.sh build/screenshots/raw light dark
      - name: Pick the App Store set (light, plus dark Discover)
        run: |
          mkdir -p fastlane/screenshots/en-US
          for name in 1-discover 2-festival 3-schedule 4-wallpaper 5-live-activity; do
            cp "build/screenshots/raw/light/$name.png" "fastlane/screenshots/en-US/$name.png"
          done
          cp build/screenshots/raw/dark/1-discover.png fastlane/screenshots/en-US/6-discover-dark.png
      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: fastlane/screenshots/en-US/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-raw
          path: build/screenshots/raw
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-test-results
          path: build/screenshots/*.xcresult
          if-no-files-found: ignore
