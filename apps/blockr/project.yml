name: Blockr
options:
  bundleIdPrefix: com.calumwebb
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: X9E4HG27NK
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    BLOCKR_CLOUD_ENABLED: 'NO'
    BLOCKR_FILTER_ENABLED: 'NO'
packages:
  BlockrCore:
    path: .
targetTemplates:
  ScreenTimeExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: Extensions/${target_name}
    dependencies:
      - package: BlockrCore
    entitlements:
      path: Extensions/${target_name}/${target_name}.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.calumwebb.blockr]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calumwebb.blockr.${target_name}
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Extensions/${target_name}/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_KEY_CFBundleDisplayName: Blockr
  MainApp:
    type: application
    sources: [App, Shared]
    dependencies:
      - package: BlockrCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calumwebb.blockr
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Blockr
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_BlockrCloudEnabled: $(BLOCKR_CLOUD_ENABLED)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # CloudKit is opt-in only after the container is provisioned; see README.
targets:
  Blockr:
    templates: [MainApp]
    platform: iOS
    entitlements:
      path: App/Blockr.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.calumwebb.blockr]
    dependencies:
      - target: ShieldConfiguration
      - target: ShieldAction
      - target: DeviceActivityMonitor
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: '1,2'
  BlockrMac:
    templates: [MainApp]
    platform: macOS
    dependencies:
      - target: ContentFilter
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/SystemExtensions
    entitlements:
      path: App/BlockrMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.system-extension.install: true
        com.apple.developer.networking.networkextension: [content-filter-provider-systemextension]
        com.apple.security.application-groups: [group.com.calumwebb.blockr]
    settings:
      base:
        PRODUCT_NAME: Blockr
        ASSETCATALOG_COMPILER_APPICON_NAME: MacIcon
        INFOPLIST_KEY_BlockrFilterEnabled: $(BLOCKR_FILTER_ENABLED)
        INFOPLIST_KEY_NSSystemExtensionUsageDescription: Blockr filters selected websites during your timed locks.
  ContentFilter:
    productName: com.calumwebb.blockr.ContentFilter
    type: system-extension
    platform: macOS
    sources: [ContentFilter, Shared]
    dependencies:
      - package: BlockrCore
    entitlements:
      path: ContentFilter/ContentFilter.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.developer.networking.networkextension: [content-filter-provider-systemextension]
        com.apple.security.application-groups: [group.com.calumwebb.blockr]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calumwebb.blockr.ContentFilter
        PRODUCT_NAME: com.calumwebb.blockr.ContentFilter
        PRODUCT_MODULE_NAME: ContentFilter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ContentFilter/Info.plist
        SKIP_INSTALL: YES
  ShieldConfiguration:
    templates: [ScreenTimeExtension]
  ShieldAction:
    templates: [ScreenTimeExtension]
  DeviceActivityMonitor:
    templates: [ScreenTimeExtension]
  BlockrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Blockr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.calumwebb.blockr.uitests
schemes:
  Blockr:
    build:
      targets:
        Blockr: all
        BlockrUITests: [test]
    test:
      targets: [BlockrUITests]
    archive:
      config: Release
  BlockrMac:
    build:
      targets:
        BlockrMac: all
