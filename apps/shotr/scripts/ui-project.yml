name: Shotr
options:
  deploymentTarget:
    iOS: '26.0'
packages:
  RDesign:
    path: RDesign
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  Shotr:
    type: application
    platform: iOS
    sources: [Shotr]
    dependencies:
      - package: RDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calum.shots
        PRODUCT_NAME: Shotr
        PRODUCT_MODULE_NAME: Shotr
        INFOPLIST_KEY_CFBundleDisplayName: Shotr
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Shotr/Info.plist
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Screenshot library
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1'
  ShotrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Shotr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calum.shots.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Shotr:
    build:
      targets:
        Shotr: all
        ShotrUITests: [test]
    test:
      targets: [ShotrUITests]
