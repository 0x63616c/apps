name: Register IDs

# Registers an app's bundle IDs and App Groups capability with the App Store Connect API key.
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App folder under apps/'
        type: string
        default: festr
      inspect_family_controls:
        description: 'Inspect Blockr managed Family Controls availability through the ASC API'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  register:
    runs-on: ${{ startsWith(vars.MACOS_RUNNER, '[') && fromJSON(vars.MACOS_RUNNER) || vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 15
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_SKIP_DOCS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APP: ${{ inputs.app }}
          INSPECT_FAMILY_CONTROLS: ${{ inputs.inspect_family_controls }}
        run: |
          if [[ "$INSPECT_FAMILY_CONTROLS" == true ]]; then
            bundle exec fastlane ios register_ids app:"$APP" inspect_family_controls:true
          else
            bundle exec fastlane ios register_ids app:"$APP"
          fi
