name: Shots
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  Shots:
    type: application
    platform: iOS
    sources: [Shots]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calum.shots
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Shots/Info.plist
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Screenshot library
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1'
  ShotsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Shots
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calum.shots.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Shots:
    build:
      targets:
        Shots: all
        ShotsUITests: [test]
    test:
      targets: [ShotsUITests]
